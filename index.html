    // Embedded Light Markdown Parser (Zero external dependency)
    function parseMarkdown(md) {
      if (!md) return '';
      let text = md.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      
      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      // Handle Code blocks first
      const codeBlocks = [];
      text = text.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const id = '___CODE_BLOCK_' + codeBlocks.length + '___';
        codeBlocks.push('<pre><code class="language-' + escapeHtml(lang) + '">' + escapeHtml(code) + '</code></pre>');
        return id;
      });

      // Split lines to handle block elements
      const lines = text.split('\n');
      const output = [];
      let inTable = false;
      let tableRows = [];
      let inList = false;
      let listType = ''; // 'ul' or 'ol'
      let inBlockquote = false;
      let bqLines = [];

      function flushTable() {
        if (!inTable) return;
        if (tableRows.length > 0) {
          let html = '<table>';
          let hasHeader = false;
          if (tableRows.length >= 2 && /^\s*\|?\s*[:\-]+\s*\|/.test(tableRows[1])) {
            hasHeader = true;
          }

          tableRows.forEach((r, rIdx) => {
            if (hasHeader && rIdx === 1) return;
            const cells = r.split('|').map(c => c.trim()).filter((c, i, arr) => {
              if ((i === 0 || i === arr.length - 1) && c === '') return false;
              return true;
            });
            
            const tag = (hasHeader && rIdx === 0) ? 'th' : 'td';
            if (hasHeader && rIdx === 0) html += '<thead>';
            else if (hasHeader && rIdx === 2) html += '<tbody>';
            
            html += '<tr>';
            cells.forEach(cell => {
              html += '<' + tag + '>' + parseInline(cell) + '</' + tag + '>';
            });
            html += '</tr>';
            
            if (hasHeader && rIdx === 0) html += '</thead>';
          });
          if (hasHeader && tableRows.length > 2) html += '</tbody>';
          html += '</table>';
          output.push(html);
        }
        tableRows = [];
        inTable = false;
      }

      function flushList() {
        if (!inList) return;
        output.push('</' + listType + '>');
        inList = false;
        listType = '';
      }

      function flushBlockquote() {
        if (!inBlockquote) return;
        const bqContent = bqLines.map(l => parseInline(l)).join('<br>');
        output.push('<blockquote>' + bqContent + '</blockquote>');
        bqLines = [];
        inBlockquote = false;
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Table check
        if (line.trim().startsWith('|') || (line.includes('|') && line.trim().endsWith('|'))) {
          flushList();
          flushBlockquote();
          inTable = true;
          tableRows.push(line.trim());
          continue;
        } else {
          flushTable();
        }

        // Horizontal rule
        if (/^\s*([*\-_]){3,}\s*$/.test(line)) {
          flushList();
          flushBlockquote();
          output.push('<hr>');
          continue;
        }

        // Blockquote
        if (/^\s*>\s*(.*)/.test(line)) {
          flushList();
          inBlockquote = true;
          const content = line.replace(/^\s*>\s*/, '');
          bqLines.push(content);
          continue;
        } else {
          flushBlockquote();
        }

        // Headers
        const headerMatch = line.match(/^(#{1,6})\s+(.*)/);
        if (headerMatch) {
          flushList();
          const level = headerMatch[1].length;
          const titleText = headerMatch[2].trim();
          const slug = 'heading-' + encodeURIComponent(titleText.toLowerCase().replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]+/g, '-'));
          output.push('<h' + level + ' id="' + slug + '">' + parseInline(titleText) + '</h' + level + '>');
          continue;
        }

        // Lists
        const ulMatch = line.match(/^(\s*)[*\-]\s+(.*)/);
        const olMatch = line.match(/^(\s*)(\d+)\.\s+(.*)/);

        if (ulMatch || olMatch) {
          const isUl = !!ulMatch;
          const currentType = isUl ? 'ul' : 'ol';
          const itemText = isUl ? ulMatch[2] : olMatch[3];

          if (!inList || listType !== currentType) {
            flushList();
            inList = true;
            listType = currentType;
            output.push('<' + listType + '>');
          }

          let taskItem = itemText;
          if (/^\[ \]\s+(.*)/.test(itemText)) {
            taskItem = '<input type="checkbox" disabled> ' + itemText.substring(4);
          } else if (/^\[[xX]\]\s+(.*)/.test(itemText)) {
            taskItem = '<input type="checkbox" checked disabled> ' + itemText.substring(4);
          }

          output.push('<li>' + parseInline(taskItem) + '</li>');
          continue;
        } else {
          flushList();
        }

        // Blank line
        if (!line.trim()) {
          continue;
        }

        // Paragraph
        output.push('<p>' + parseInline(line) + '</p>');
      }

      flushTable();
      flushList();
      flushBlockquote();

      let resultHtml = output.join('\n');

      // Restore Code blocks
      codeBlocks.forEach((block, idx) => {
        resultHtml = resultHtml.replace('___CODE_BLOCK_' + idx + '___', block);
      });

      return resultHtml;
    }

    function parseInline(text) {
      if (!text) return '';
      let str = text;

      // Inline code
      str = str.replace(/`([^`]+)`/g, function(match, code) {
        return '<code>' + code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
      });

      // Images
      str = str.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%; border-radius:6px;">');

      // Links
      str = str.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

      // Auto link naked URLs
      str = str.replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');

      // Bold & Italic
      str = str.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');

      // Bold
      str = str.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      // Italic
      str = str.replace(/\*(.*?)\*/g, '<em>$1</em>');

      // Strikethrough
      str = str.replace(/~~(.*?)~~/g, '<del>$1</del>');

      return str;
    }

    // Application Logic
    document.addEventListener('DOMContentLoaded', () => {
      const docsDataEl = document.getElementById('docs-data');
      const docs = JSON.parse(docsDataEl.textContent.trim());
      
      const fileListEl = document.getElementById('file-list');
      const searchInput = document.getElementById('search-input');
      const viewer = document.getElementById('markdown-viewer');
      const viewTitle = document.getElementById('view-title');
      const btnOpenRaw = document.getElementById('btn-open-raw');
      const btnDownloadRaw = document.getElementById('btn-download-raw');
      const contentScroll = document.getElementById('content-scroll');

      let currentDocId = null;

      function renderSidebar(filterText = '') {
        fileListEl.innerHTML = '';
        const lower = filterText.toLowerCase().trim();
        
        const filtered = docs.filter(d => {
          return d.filename.toLowerCase().includes(lower) || 
                 d.content.toLowerCase().includes(lower);
        });

        if (filtered.length === 0) {
          fileListEl.innerHTML = '<li style="padding:16px; color:#64748b; font-size:0.85rem; text-align:center;">無符合的文件</li>';
          return;
        }

        filtered.forEach(d => {
          const li = document.createElement('li');
          li.className = 'file-item' + (d.id === currentDocId ? ' active' : '');
          li.dataset.id = d.id;

          const titleDiv = document.createElement('div');
          titleDiv.className = 'file-title';
          titleDiv.textContent = d.title;

          li.appendChild(titleDiv);

          li.addEventListener('click', () => {
            selectDoc(d.id);
          });

          fileListEl.appendChild(li);
        });
      }

      function selectDoc(docId) {
        const doc = docs.find(d => d.id === docId);
        if (!doc) return;

        currentDocId = docId;

        // Update active class in sidebar
        document.querySelectorAll('.file-item').forEach(el => {
          el.classList.toggle('active', el.dataset.id === docId);
        });

        // Update header & buttons
        viewTitle.textContent = doc.title;
        btnOpenRaw.href = encodeURI(doc.filename);
        btnDownloadRaw.href = encodeURI(doc.filename);
        btnDownloadRaw.setAttribute('download', doc.filename);

        // Render markdown
        viewer.innerHTML = parseMarkdown(doc.content);

        // Scroll content to top
        contentScroll.scrollTop = 0;

        // Update URL hash
        history.replaceState(null, null, '#' + doc.id);
      }

      // Search input listener
      searchInput.addEventListener('input', (e) => {
        renderSidebar(e.target.value);
      });

      // Initial route selection from Hash
      function initRoute() {
        renderSidebar();
        let targetId = docs[0] ? docs[0].id : null;
        const hash = window.location.hash.replace('#', '');
        if (hash) {
          const parts = hash.split('/');
          const found = docs.find(d => d.id === parts[0]);
          if (found) {
            targetId = found.id;
          }
        }
        if (targetId) {
          selectDoc(targetId);
        }
      }

      initRoute();
    });
  </script>
</body>
